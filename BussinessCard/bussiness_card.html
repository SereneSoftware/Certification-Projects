<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width inital-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Business Card</title>
  </head>
  <body>
    <main>
      <div class="business-card">
        <h1>Business Card</h1>
        <img
          class="profile-image"
          src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg"
          alt="glassware-photo"
        />
        <p class="full-name">Aanya Massey</p>
        <p class="designation">Technical Project Manager</p>
        <p class="company">@Amazon</p>
        <hr />
        <p>Email: example@gmail.com</p>
        <p>Phone: 123 456 6789</p>
        <a href="#" class="portfolio-link">Portfolio</a>
        <hr />
        <div class="social-media">
          <h2>Connect with me</h2>
          <a href="#">Twitter</a>
          <a href="#">LinkedIn</a>
          <a href="#">GitHub</a>
        </div>
      </div>
    </main>
  </body>
</html>
