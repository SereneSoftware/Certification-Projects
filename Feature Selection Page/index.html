<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Selection Feature Page</title>
    <link href="styles.css" rel="stylesheet" />
  </head>

  <body>
    <h1>Feature Selection</h1>
    <div class="container">
      <div class="feature-card-container">
        <label for="cloudStorage" class="feature-card">
          Cloud Storage
          <input type="checkbox" id="cloudStorage" name="cloudStorage" />
        </label>
        <p>100 Gigabyte secure storage</p>
      </div>

      <div class="feature-card-container">
        <label for="dedicatedSupport" class="feature-card">
          Dedicated Support
          <input
            type="checkbox"
            id="dedicatedSupport"
            name="dedicatedSupport"
          />
        </label>
        <p>24/7 customer help</p>
      </div>

      <div class="feature-card-container">
        <label for="advancedAnalytics" class="feature-card"
          >Advanced Analytics
          <input
            type="checkbox"
            id="advancedAnalytics"
            name="advancedAnalytics"
          />
        </label>
        <p>Insights & reports</p>
      </div>

      <div class="feature-card-container">
        <label for="multi-UserCollab" class="feature-card"
          >Multi-User Collab
          <input
            type="checkbox"
            id="multi-UserCollab"
            name="multi-UserCollab"
          />
        </label>
        <p>Team access and sharing</p>
      </div>

      <div class="feature-card-container">
        <label for="customUserThemes" class="feature-card"
          >Custom User Themes
          <input
            type="checkbox"
            id="customUserThemes"
            name="customUserThemes"
          />
        </label>
        <p>Personalized dashboard design</p>
      </div>

      <div class="feature-card-container">
        <label for="aPIAccess" class="feature-card"
          >API Access
          <input type="checkbox" id="aPIAccess" name="aPIAccess" />
        </label>
        <p>Integrate with your custom built tools</p>
      </div>
    </div>
  </body>
</html>
