<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Application Form</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Job Application form</h1>
      <p>Kindly fill the form for Job in XYZ Company</p>
      <form>
        <label for="name">Full Name: </label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="E. g. John Doe"
          required
        />
        <label for="email">Email: </label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="E. g.  johndoe@gmail.com"
          required
        />
        <label for="position">Position: </label>
        <select id="position" position="position">
          <option value="" selected disabled hidden>Select a Post</option>
          <option id="developer" name="position" value="developer">
            Developer
          </option>
          <option id="manager" name="position" value="manager">Manager</option>
          <option id="engineer" name="position" value="engineer">
            Engineer
          </option>
        </select>
        <fieldset class="radio-group">
          <legend>Availability:</legend>
          <input
            class="radioinput"
            type="radio"
            id="part-time"
            name="availability"
          />
          <label for="part-time">Part-Time</label>
          <input
            class="radioinput"
            type="radio"
            id="full-time"
            name="availability"
          />
          <label for="full-time">Full-Time</label>
        </fieldset>
        <label for="message">Why do you want this Job?</label>
        <textarea id="message" rows="4" cols="50" required></textarea>
        <button type="submit">Submit</button>
      </form>
    </div>
  </body>
</html>
